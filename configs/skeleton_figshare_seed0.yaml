seed: 0
source: figshare
split: grouped
classes: [meningioma, glioma, pituitary]
model:
  name: efficientnet_b0
  pretrained: true
train:
  epochs: 5          # small for the first end-to-end run; raise to ~15 for R1 (Phase 2)
  batch_size: 32
  lr: 0.0003
  image_size: 224
  num_workers: 2
transforms:
  train: [resize, hflip, normalize]   # resolved in data/dataset.py:build_transforms
  eval: [resize, normalize]
run_id: skeleton_figshare_grouped_seed0
